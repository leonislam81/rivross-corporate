name: Publish theme release when its version changes

on:
  push:
    branches: [main]
    paths:
      - 'style.css'
      - 'functions.php'
      - '.github/workflows/publish-theme-version.yml'

permissions:
  contents: write

concurrency:
  group: rivross-theme-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish a versioned theme release
    if: github.repository == 'leonislam81/rivross-corporate'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pushed theme
        uses: actions/checkout@v4

      - name: Validate matching theme versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          style_version="$(sed -nE 's/^Version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*$/\1/p' style.css | head -n 1)"
          function_version="$(sed -nE "s/.*RIVROSS_THEME_VERSION', '([0-9]+\.[0-9]+\.[0-9]+)'.*/\1/p" functions.php | head -n 1)"
          if [[ -z "$style_version" || "$style_version" != "$function_version" ]]; then
            echo "style.css and functions.php must declare the same X.Y.Z theme version."
            exit 1
          fi
          echo "value=$style_version" >> "$GITHUB_OUTPUT"

      - name: Check whether this is a newer release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          THEME_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          latest_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // ""')"
          latest_version="${latest_tag#v}"

          if [[ "$latest_version" == "$THEME_VERSION" ]]; then
            echo "Theme version $THEME_VERSION already has a release; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "$latest_version" ]]; then
            if [[ ! "$latest_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Latest release tag is not a semantic version: $latest_tag"
              exit 1
            fi
            newest="$(printf '%s\n%s\n' "$latest_version" "$THEME_VERSION" | sort -V | tail -n 1)"
            if [[ "$newest" != "$THEME_VERSION" ]]; then
              echo "Theme version $THEME_VERSION is not newer than the latest release $latest_tag."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Build installable packages
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/rivross-theme-package"
          mkdir -p "$package_root/theme/rivross-corporate" "$package_root/updater/rivross-theme-updater"
          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/README.md' \
            --exclude='/.gitignore' \
            --exclude='/updater-plugin/' \
            ./ "$package_root/theme/rivross-corporate/"
          cp updater-plugin/rivross-theme-updater.php "$package_root/updater/rivross-theme-updater/"
          (cd "$package_root/theme" && zip -qr "$RUNNER_TEMP/rivross-corporate.zip" rivross-corporate)
          (cd "$package_root/updater" && zip -qr "$RUNNER_TEMP/rivross-theme-updater.zip" rivross-theme-updater)

      - name: Create release and attach installable ZIPs
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          THEME_VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "v$THEME_VERSION" \
            "$RUNNER_TEMP/rivross-corporate.zip" \
            "$RUNNER_TEMP/rivross-theme-updater.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "RIVROSS Corporate $THEME_VERSION" \
            --notes "Automated theme release. Installing the theme update changes theme files only; it does not replace WordPress pages, media, settings, or database content."
