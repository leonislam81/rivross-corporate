name: Deploy RIVROSS Corporate theme

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-rivross-corporate-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy theme files over SSH
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out theme
        uses: actions/checkout@v4

      - name: Configure SSH and deploy theme only
        shell: bash
        env:
          LIVE_SSH_HOST: ${{ secrets.LIVE_SSH_HOST }}
          LIVE_SSH_PORT: ${{ secrets.LIVE_SSH_PORT }}
          LIVE_SSH_USER: ${{ secrets.LIVE_SSH_USER }}
          LIVE_SSH_PRIVATE_KEY: ${{ secrets.LIVE_SSH_PRIVATE_KEY }}
          LIVE_SSH_KNOWN_HOSTS: ${{ secrets.LIVE_SSH_KNOWN_HOSTS }}
          LIVE_THEME_PATH: ${{ secrets.LIVE_THEME_PATH }}
        run: |
          set -euo pipefail

          for name in LIVE_SSH_HOST LIVE_SSH_PORT LIVE_SSH_USER LIVE_SSH_PRIVATE_KEY LIVE_SSH_KNOWN_HOSTS LIVE_THEME_PATH; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions secret: ${name}"
              exit 1
            fi
          done

          [[ "$LIVE_SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "Invalid SSH host format"; exit 1; }
          [[ "$LIVE_SSH_PORT" =~ ^[0-9]{1,5}$ ]] || { echo "Invalid SSH port format"; exit 1; }
          [[ "$LIVE_SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid SSH username format"; exit 1; }
          [[ "$LIVE_THEME_PATH" =~ ^/[A-Za-z0-9_./-]+$ && "$LIVE_THEME_PATH" != *".."* ]] || { echo "Theme path must be an absolute, normalized path"; exit 1; }

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$LIVE_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$LIVE_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null

          ssh -p "$LIVE_SSH_PORT" -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$LIVE_SSH_USER@$LIVE_SSH_HOST" "mkdir -p -- '$LIVE_THEME_PATH'"

          rsync -az --omit-dir-times \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/README.md' \
            --exclude='/.gitignore' \
            -e "ssh -p $LIVE_SSH_PORT -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            ./ "$LIVE_SSH_USER@$LIVE_SSH_HOST:${LIVE_THEME_PATH%/}/"
