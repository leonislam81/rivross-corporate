name: Package RIVROSS theme release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    name: Attach installable ZIPs
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4

      - name: Verify the release tag matches the theme version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          theme_version="$(sed -nE 's/^Version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*$/\1/p' style.css | head -n 1)"
          if [[ -z "$theme_version" || "$tag_version" != "$theme_version" ]]; then
            echo "Release tag (${GITHUB_REF_NAME}) must match style.css Version (${theme_version:-missing})."
            exit 1
          fi

      - name: Build installable packages
        shell: bash
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/rivross-theme-package"
          mkdir -p "$package_root/theme/rivross-corporate" "$package_root/updater/rivross-theme-updater"
          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/README.md' \
            --exclude='/.gitignore' \
            --exclude='/updater-plugin/' \
            ./ "$package_root/theme/rivross-corporate/"
          cp updater-plugin/rivross-theme-updater.php "$package_root/updater/rivross-theme-updater/"
          (cd "$package_root/theme" && zip -qr "$RUNNER_TEMP/rivross-corporate.zip" rivross-corporate)
          (cd "$package_root/updater" && zip -qr "$RUNNER_TEMP/rivross-theme-updater.zip" rivross-theme-updater)

      - name: Attach ZIPs to the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/rivross-corporate.zip" "$RUNNER_TEMP/rivross-theme-updater.zip" --repo "$GITHUB_REPOSITORY"
